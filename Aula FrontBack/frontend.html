<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aula 4 - Conectando Front e Back</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: #fdfbf7;
            padding: 50px;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        input {
            padding: 12px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background: #8BC34A;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            transition: background 0.3s;
        }
        button:hover {
            background: #7CB342;
        }
        #resultado {
            margin-top: 25px;
            text-align: left;
        }
        .item {
            background: #f1f8e9;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 4px solid #8BC34A;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="titulo">Nossa Aplicação</h1>
        <h2 id="subtitulo">Apenas FrontEnd</h2>
        
        <!-- Imagem Dinâmica -->
        <img id="imagem" src="" alt="Imagem Dinâmica">
        
        <input type="text" id="meuInput" placeholder="Digite um dado para salvar...">
        <button id="meuBotao">Enviar Dados</button>
        
        <div id="resultado">
        </div>
    </div>

    <script>
        document.getElementById('meuBotao').addEventListener('click', () => {
            const texto = document.getElementById('meuInput').value;
            if(!texto) return alert('Digite algo para salvar!');
            
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = texto;
            document.getElementById('resultado').appendChild(div);
            
            document.getElementById('meuInput').value = '';
        });
    </script>
</body>
</html>
